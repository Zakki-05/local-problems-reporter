{% extends 'base.html' %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center bg-slate-50 py-12 px-4 sm:px-6 lg:px-8">
    <div class="max-w-md w-full space-y-8 glass p-10 rounded-3xl shadow-xl border border-white">
        <div>
            <h2 class="mt-6 text-center text-3xl font-extrabold text-slate-900">
                Sign in to your account
            </h2>
            <p class="mt-2 text-center text-sm text-slate-600">
                Or
                <a href="{% url 'register' %}" class="font-medium text-blue-600 hover:text-blue-500 transition">
                    create a new account
                </a>
            </p>
        </div>
        <form class="mt-8 space-y-6" action="{% url 'login' %}" method="POST">
            {% csrf_token %}
            <input type="hidden" name="next" value="{{ next }}">
            <div class="rounded-md shadow-sm -space-y-px">
                <div class="mb-4">
                    <label for="id_username" class="sr-only">Username</label>
                    <input id="id_username" name="username" type="text" required class="appearance-none rounded-t-xl relative block w-full px-3 py-4 border border-slate-300 placeholder-slate-500 text-slate-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm bg-white/70" placeholder="Username">
                </div>
                <div>
                    <label for="id_password" class="sr-only">Password</label>
                    <input id="id_password" name="password" type="password" required class="appearance-none rounded-b-xl relative block w-full px-3 py-4 border border-slate-300 placeholder-slate-500 text-slate-900 focus:outline-none focus:ring-blue-500 focus:border-blue-500 focus:z-10 sm:text-sm bg-white/70" placeholder="Password">
                </div>
            </div>
            
            {% if form.errors %}
            <div class="text-red-500 text-sm text-center">
                Invalid username or password.
            </div>
            {% endif %}

            <div>
                <button type="submit" class="group relative w-full flex justify-center py-3 px-4 border border-transparent text-sm font-medium rounded-xl text-white bg-blue-600 hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition shadow-lg transform hover:-translate-y-0.5">
                    Sign in
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
